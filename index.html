<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Mis Gastos"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Control de Gastos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0f;
  --bg2:#12121a;
  --bg3:#1a1a26;
  --border:#ffffff0f;
  --text:#f0f0f8;
  --text2:#8888aa;
  --text3:#44445a;
  --blue:#4f8ef7;
  --blue2:#3a7ee8;
  --green:#34d17a;
  --red:#ff5f57;
  --amber:#ffb340;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 8px 32px rgba(0,0,0,0.4);
}
html{height:100%;background:var(--bg);}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:0;}

/* ── TRANSITIONS ── */
.fade-in{animation:fadeIn .25s ease both;}
.slide-up{animation:slideUp .3s cubic-bezier(.32,1.2,.6,1) both;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}

/* ── GLASS CARDS ── */
.card{
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 100%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.card-press{transition:transform .12s ease,opacity .12s ease;}
.card-press:active{transform:scale(.97);opacity:.85;}

/* ── BUTTONS ── */
.bp{
  background:var(--blue);
  color:#fff;border:none;
  border-radius:14px;
  padding:14px 22px;
  font-family:inherit;font-weight:600;cursor:pointer;font-size:15px;
  transition:transform .1s,opacity .1s;
  box-shadow:0 4px 16px rgba(79,142,247,.35);
}
.bp:active{transform:scale(.96);opacity:.9;}
.bg{
  background:rgba(255,255,255,.07);
  color:var(--text2);
  border:1px solid var(--border);
  border-radius:14px;padding:14px 18px;
  font-family:inherit;font-weight:500;cursor:pointer;font-size:15px;
  transition:transform .1s,opacity .1s;
}
.bg:active{transform:scale(.96);}
.bg-danger{color:var(--red);border-color:rgba(255,95,87,.3);background:rgba(255,95,87,.08);}

/* ── INPUTS ── */
.fl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;display:block;}
.fi{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:16px;outline:none;
  transition:border-color .2s,background .2s;
  -webkit-appearance:none;
}
.fi:focus{border-color:var(--blue);background:rgba(79,142,247,.08);}
.fit{font-family:'DM Sans',sans-serif!important;}
select.fi option{background:#1a1a26;}

/* ── PROGRESS ── */
.pb{height:6px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;}
.pf{height:100%;border-radius:6px;transition:width .7s cubic-bezier(.4,0,.2,1);}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  animation:fadeIn .2s ease both;
}
.modal{
  background:linear-gradient(180deg,#1c1c2e 0%,#16162a 100%);
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px 28px 0 0;
  padding:8px 24px 40px;
  width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.32,1.2,.6,1) both;
}
.modal-handle{width:40px;height:5px;background:rgba(255,255,255,.15);border-radius:3px;margin:12px auto 20px;}

/* ── TABS (bottom nav style) ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,10,15,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:center;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  z-index:50;gap:4px;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border:none;background:none;cursor:pointer;
  font-family:inherit;color:var(--text3);font-size:10px;font-weight:500;
  transition:color .2s;border-radius:12px;
}
.nav-item.on{color:var(--blue);}
.nav-item .nav-icon{font-size:22px;line-height:1;transition:transform .2s;}
.nav-item.on .nav-icon{transform:scale(1.1);}
.nav-item span{letter-spacing:.01em;}

/* ── CHIP ── */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;border:1px solid transparent;
  background:rgba(255,255,255,.06);margin:3px;
  transition:all .15s;color:var(--text2);
}
.chip.on{border-color:var(--blue);background:rgba(79,142,247,.15);color:var(--blue);}

/* ── EMOJI BTN ── */
.ej{
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;width:40px;height:40px;font-size:19px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;margin:2px;
  transition:all .15s;
}
.ej.on{border-color:var(--blue);background:rgba(79,142,247,.15);}
.cd{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-block;margin:3px;transition:all .15s;}
.cd.on{border-color:#fff;transform:scale(1.25);box-shadow:0 0 0 3px rgba(255,255,255,.2);}

/* ── SCREEN ── */
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:32px;text-align:center;}

/* ── FAB ── */
.fab{
  position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));right:20px;
  width:56px;height:56px;border-radius:28px;
  background:var(--blue);color:#fff;border:none;
  font-size:26px;line-height:1;cursor:pointer;
  box-shadow:0 6px 24px rgba(79,142,247,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:49;
  transition:transform .15s,box-shadow .15s;
}
.fab:active{transform:scale(.9);box-shadow:0 3px 12px rgba(79,142,247,.4);}

/* ── HEADER ── */
.header{
  background:rgba(10,10,15,.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:calc(16px + env(safe-area-inset-top)) 20px 16px;
  position:sticky;top:0;z-index:40;
}

/* ── SUMMARY CARDS ── */
.sum-card{
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;min-width:0;overflow:hidden;
}

/* ── SPINNER ── */
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── TOAST FLOTANTE ── */
.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(18px);
  opacity:0;pointer-events:none;z-index:60;
  display:flex;align-items:center;gap:9px;white-space:nowrap;
  background:rgba(26,26,38,.82);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.13);border-radius:100px;
  padding:11px 20px;font-size:14px;font-weight:600;color:var(--text);
  box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
  transition:opacity .3s cubic-bezier(.3,1,.5,1),transform .38s cubic-bezier(.34,1.4,.5,1);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .tspin{width:15px;height:15px;border:2px solid rgba(255,255,255,.18);
 border-top-color:var(--blue);border-radius:50%;animation:tsp .7s linear infinite;flex-shrink:0}
@keyframes tsp{to{transform:rotate(360deg)}}
.toast .chk{width:17px;height:17px;flex-shrink:0}
.toast .chk circle{stroke-dasharray:52;stroke-dashoffset:52;animation:tdc .4s ease .05s forwards}
.toast .chk path{stroke-dasharray:20;stroke-dashoffset:20;animation:tdp .3s ease .3s forwards}
@keyframes tdc{to{stroke-dashoffset:0}}
@keyframes tdp{to{stroke-dashoffset:0}}

/* ── COMPARACIÓN MENSUAL ── */
.cmp-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
 padding:4px 10px;border-radius:20px;margin-top:10px}
.cmp-pill.up{background:rgba(255,95,87,.13);color:#ff8b85}
.cmp-pill.dn{background:rgba(52,209,122,.13);color:#7ff0b0}
.cmp-pill.eq{background:rgba(255,255,255,.06);color:var(--text2)}

/* ── GASTOS FRECUENTES ── */
.qa-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:10px}
.qa{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.qa::-webkit-scrollbar{display:none}
.qa-item{flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;
 padding:10px 13px;cursor:pointer;transition:all .18s;min-width:112px}
.qa-item:active{transform:scale(.95);background:rgba(79,142,247,.14);border-color:var(--blue)}
.qa-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.qa-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa-am{font-family:'DM Mono',monospace;font-size:13px;font-weight:700}
.toast .sep{width:1px;height:15px;background:rgba(255,255,255,.15);margin:0 2px;flex-shrink:0}

/* ── HÉROE ── */
.hero-card{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
 border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px}
.hero-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:8px}
.hero-num{font-family:'DM Mono',monospace;font-weight:700;font-size:38px;letter-spacing:-1.5px;line-height:1;color:var(--green);word-break:break-all}
.hero-sub{font-size:12px;color:var(--text2);margin-top:8px}
.hero-foot{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.hero-foot>div{flex:1;min-width:0}
.hf-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px}
.hf-v{font-family:'DM Mono',monospace;font-weight:700;font-size:15px;word-break:break-all}

/* ── FILTROS DE GASTOS ── */
.srch{position:relative;margin-bottom:12px}
.srch input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:13px;
 padding:11px 38px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.srch input:focus{border-color:var(--blue);background:rgba(79,142,247,.07)}
.srch .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5;pointer-events:none}
.srch .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);
 border:none;color:var(--text2);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1}
.wkrow{display:flex;gap:5px;margin-bottom:11px}
.wkrow button{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text3);
 border-radius:12px;padding:9px 2px;font-family:inherit;cursor:pointer;transition:all .22s;min-width:0}
.wkrow button.on{background:rgba(79,142,247,.16);border-color:var(--blue);color:var(--blue)}
.wkrow .wl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.wkrow .wv{font-size:10px;font-family:'DM Mono',monospace;font-weight:600;margin-top:3px;opacity:.8;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.calrow{display:flex;gap:5px;margin-bottom:11px}
.dcell{flex:1;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--border);
 padding:8px 0 7px;text-align:center;cursor:pointer;transition:all .22s;min-width:0}
.dcell.on{background:rgba(79,142,247,.18);border-color:var(--blue);transform:translateY(-2px)}
.dcell.on .dnum{color:var(--blue)}
.dcell.void{opacity:.3}
.dwd{font-size:9px;color:var(--text3);text-transform:uppercase;font-weight:700}
.dnum{font-size:15px;font-weight:700;font-family:'DM Mono',monospace;line-height:1.35}
.dbar{border-radius:2px;margin:3px auto 0;width:18px}
.selrow{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 12px;gap:10px}
.selrow .l{font-size:14px;font-weight:700;min-width:0}
.selrow .s{font-size:11px;color:var(--text3);font-weight:500;margin-left:6px}
.selrow .r{font-family:'DM Mono',monospace;font-weight:700;font-size:16px;color:var(--amber);white-space:nowrap}
.dayhdr{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 6px}
.dayhdr b{font-size:12px;color:var(--text2);font-weight:600}
.dayhdr span{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);font-weight:600}

/* ── REORDENAR CATEGORÍAS ── */
.cat-list{display:grid;gap:10px;position:relative}
.cat-row{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 16px;
 will-change:transform;transition:transform .25s cubic-bezier(.32,1,.5,1),box-shadow .2s,opacity .2s}
.cat-row.dragging{z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.55);
 transition:box-shadow .2s;opacity:.97;position:relative}
.cat-row.settling{transition:transform .25s cubic-bezier(.32,1,.5,1)}
.grip{width:34px;height:44px;display:flex;align-items:center;justify-content:center;
 flex-shrink:0;cursor:grab;color:var(--text3);font-size:17px;letter-spacing:-1px;
 touch-action:none;border-radius:10px;transition:background .2s,color .2s;user-select:none;-webkit-user-select:none}
.grip:active{background:rgba(255,255,255,.07);color:var(--blue)}
.reorder-hint{font-size:12px;color:var(--text3);text-align:center;padding:14px 8px 2px;line-height:1.5}

/* ── SWIPE ── */
.sw-row{position:relative;overflow:hidden;border-radius:18px;margin-bottom:10px}
.sw-bg{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,95,87,0),var(--red) 45%);
 display:flex;align-items:center;justify-content:flex-end;padding-right:22px;
 font-weight:700;font-size:14px;color:#fff;cursor:pointer}
.sw-fg{position:relative;background:#14141f;border:1px solid var(--border);border-radius:18px;
 transition:transform .28s cubic-bezier(.32,1,.5,1);touch-action:pan-y}

/* ── DONA ── */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-svg{transform-origin:center;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.lrow{display:flex;align-items:center;gap:8px;font-size:12px;opacity:0;transform:translateX(-6px)}
.lrow.in{animation:lrowIn .45s cubic-bezier(.3,1,.5,1) both}
@keyframes lrowIn{to{opacity:1;transform:translateX(0)}}
.ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lname{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lval{font-family:'DM Mono',monospace;font-weight:600;font-size:11px;flex-shrink:0}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .45s ease, visibility .45s ease;
}
#splash.hide{opacity:0;visibility:hidden;}
#splash img{
  width:104px;height:104px;border-radius:24px;
  animation:splashPop .7s cubic-bezier(.34,1.4,.5,1) both;
  box-shadow:0 12px 48px rgba(79,142,247,.28);
}
#splash .splash-name{
  font-size:26px;font-weight:700;letter-spacing:2px;color:#fff;
  animation:splashFade .6s ease .25s both;
}
#splash .splash-sub{
  font-size:12px;color:#5a5a75;letter-spacing:3px;text-transform:uppercase;font-weight:600;
  animation:splashFade .6s ease .4s both;
}
#splash .splash-dots{
  display:flex;gap:6px;margin-top:6px;
  animation:splashFade .6s ease .55s both;
}
#splash .splash-dots i{
  width:6px;height:6px;border-radius:50%;background:#4f8ef7;display:block;
  animation:dotPulse 1.2s ease-in-out infinite;
}
#splash .splash-dots i:nth-child(2){animation-delay:.15s}
#splash .splash-dots i:nth-child(3){animation-delay:.3s}
@keyframes splashPop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes splashFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotPulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* ── SAVE STATUS ── */
.save-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:600;font-family:'DM Mono',monospace;
  transition:all .3s;
}
</style>
</head>
<body>

<!-- Truco háptico iOS 17.4+ (invisible, sin efecto si no está soportado) -->
<input type="checkbox" switch id="ios-haptic"
  style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:-100px;top:-100px"
  aria-hidden="true" tabindex="-1"/>

<!-- SPLASH -->
<div id="splash">
  <img src="icon.png" alt="Kash"/>
  <div>
    <div class="splash-name">KASH</div>
  </div>
  <div class="splash-sub">Control Financiero</div>
  <div class="splash-dots"><i></i><i></i><i></i></div>
</div>

<!-- LOADING -->
<div id="s-loading" class="screen" style="display:flex">
  <div class="spin"></div>
  <div style="font-size:15px;color:var(--text2)" id="loading-msg">Conectando…</div>
</div>

<!-- ERROR -->
<div id="s-error" class="screen">
  <div style="font-size:48px">⚠️</div>
  <div style="font-weight:700;font-size:20px">Error al conectar</div>
  <div id="error-msg" style="font-size:14px;color:var(--text2);max-width:300px;line-height:1.5"></div>
  <button class="bp" onclick="init()" style="width:200px">Reintentar</button>
</div>

<!-- APP -->
<div id="app" style="display:none;padding-bottom:120px">

  <!-- HEADER -->
  <div class="header">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div>
        <div style="font-size:11px;color:var(--blue);letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:3px">Control Financiero</div>
        <div style="font-size:22px;font-weight:700;letter-spacing:-.5px">Presupuesto</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button onclick="prevMonth()" style="background:rgba(255,255,255,.08);border:none;color:var(--text2);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;">‹</button>
        <div id="month-lbl" style="font-family:'DM Mono',monospace;font-size:13px;font-weight:600;min-width:110px;text-align:center"></div>
        <button onclick="nextMonth()" style="background:rgba(255,255,255,.08);border:none;color:var(--text2);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;">›</button>
      </div>
    </div>

    <!-- HÉROE -->
    <div class="hero-card">
      <div class="hero-lbl">Disponible este mes</div>

function pintarComparacion(gastoActual){
  const el=document.getElementById("s-cmp");
  if(!el)return;
  const prev=new Date(curYear,curMonth-1,1);
  const nombrePrev=MONTHS[prev.getMonth()].toLowerCase();
  if(gastoMesAnterior===null||gastoMesAnterior<=0||gastoActual<=0){el.style.display="none";return;}
  const dif=((gastoActual-gastoMesAnterior)/gastoMesAnterior)*100;
  const abs=Math.abs(Math.round(dif));
  el.style.display="inline-flex";
  if(abs<5){el.className="cmp-pill eq";el.textContent=`≈ Similar a ${nombrePrev}`;}
  else if(dif>0){el.className="cmp-pill up";el.textContent=`↑ ${abs}% más que ${nombrePrev}`;}
  else{el.className="cmp-pill dn";el.textContent=`↓ ${abs}% menos que ${nombrePrev}`;}
}

// ── SUBTÍTULO DEL HÉROE ───────────────────────────────────────────────────────
function diasDelMes(y,m){return new Date(y,m+1,0).getDate();}
function subtituloHeroe(tb,ts,tl){
  const hoy=new Date();
  const esMesActual=(hoy.getFullYear()===curYear&&hoy.getMonth()===curMonth);
  const total=diasDelMes(curYear,curMonth);
  const restan=esMesActual?total-hoy.getDate():0;
  if(tb<=0)return "Aún no defines presupuestos";
  const pctLibre=Math.max(0,Math.round(tl/tb*100));
  if(tl<0)return `Excedido · llevas <strong style="color:var(--text)">${Math.round(ts/tb*100)}%</strong> del presupuesto`;
  let t=`Te queda el <strong style="color:var(--text)">${pctLibre}%</strong>`;
  if(esMesActual)t+= restan>0?` · faltan <strong style="color:var(--text)">${restan}</strong> día${restan===1?"":"s"}`:" · último día del mes";
  return t;
}

// ── HÁPTICA ───────────────────────────────────────────────────────────────────
// Android usa navigator.vibrate. iOS 17.4+ responde al toggle de un <input switch>.
// Si el dispositivo no soporta ninguno, simplemente no ocurre nada.
const _swHaptic=()=>{
  const el=document.getElementById("ios-haptic");
  if(!el)return;
  try{el.checked=!el.checked;}catch{}
};
function haptic(tipo){
  const p={light:8,medium:18,heavy:30,double:[12,50,12]}[tipo]||8;
  if(navigator.vibrate){try{navigator.vibrate(p);}catch{}}
  _swHaptic();
  if(tipo==="double")setTimeout(_swHaptic,60);
}

// ── CONTADOR ANIMADO ──────────────────────────────────────────────────────────
const easeOutC=p=>1-Math.pow(1-p,3);
function countTo(el,to,dur=750){
  if(!el)return;
  const from=0,t0=performance.now();
  el.__anim=(el.__anim||0)+1;
  const mine=el.__anim;
  (function step(t){
    if(el.__anim!==mine)return;
    const p=Math.min((t-t0)/dur,1);
    el.textContent=fmt(Math.round(from+(to-from)*easeOutC(p)));
    if(p<1)requestAnimationFrame(step);
  })(performance.now());
}

// ── DONA (opción B: crecer con rebote) ────────────────────────────────────────
const NS_SVG="http://www.w3.org/2000/svg";
function buildDonut(datos,total){
  const CX=65,CY=65,R=48,SW=18,CIRC=2*Math.PI*R;
  let svg=`<svg width="130" height="130" viewBox="0 0 130 130" class="donut-svg" id="donut-svg">`;
  svg+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="${SW}"/>`;
  let acc=0;
  datos.forEach(d=>{
    const len=CIRC*(d.v/total);
    svg+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${d.c}" stroke-width="${SW}"
      stroke-linecap="round" stroke-dasharray="${Math.max(len-3,2).toFixed(1)} ${CIRC.toFixed(1)}"
      transform="rotate(${(-90+(acc/CIRC)*360).toFixed(2)} ${CX} ${CY})"/>`;
    acc+=len;
  });
  svg+=`</svg>`;
  return svg;
}
function animateDonut(){
  const svg=document.getElementById("donut-svg");
  if(!svg)return;
  svg.style.transformOrigin="65px 65px";
  svg.style.transition="none";
  svg.style.transform="scale(.4) rotate(-45deg)";
  svg.style.opacity="0";
  requestAnimationFrame(()=>{
    svg.style.transition="transform .75s cubic-bezier(.34,1.5,.5,1), opacity .4s ease";
    svg.style.transform="scale(1) rotate(0deg)";
    svg.style.opacity="1";
  });
  const lg=document.getElementById("donut-legend");
  if(lg)requestAnimationFrame(()=>lg.querySelectorAll(".lrow").forEach(r=>r.classList.add("in")));
  const tot=document.getElementById("donut-total");
  if(tot)countTo(tot,Number(tot.dataset.v||0),800);
}

    if(!hist.some(r=>r.mes===mPrev))gastoMesAnterior=null;
    frecuentes=calcFrecuentes(hist);
  }catch{gastoMesAnterior=null;frecuentes=[];}
}

// ── GASTOS FRECUENTES ──
function calcFrecuentes(hist){
  const mapa={};
  hist.forEach(r=>{
    const desc=(r.descripcion||"").trim();
    if(!desc)return;
    const k=desc.toLowerCase()+"|"+r.categoria_id;
    if(!mapa[k])mapa[k]={desc,cat:r.categoria_id,montos:[],meses:new Set()};
    mapa[k].montos.push(Number(r.monto));
    mapa[k].meses.add(r.mes);
  });
  return Object.values(mapa)
    .filter(f=>f.meses.size>=2)                       // aparece en 2+ meses distintos
    .map(f=>({desc:f.desc,cat:f.cat,
      monto:Math.round(f.montos.slice(-1)[0]),        // el más reciente
      veces:f.meses.size}))
    .sort((a,b)=>b.veces-a.veces||b.monto-a.monto)
    .slice(0,6);
}

let selBloque=0;      // 0..3 = bloque · -1 = mes completo
let selDia=null;      // día concreto o null
let busq="";

function bloquesDelMes(){
  const dias=diasDelMes(curYear,curMonth);
  const base=Math.floor(dias/4), extra=dias%4;
  const out=[];let ini=1;
  for(let i=0;i<4;i++){const len=base+(i<extra?1:0);out.push([ini,ini+len-1]);ini+=len;}
  return out;
}
function diaDe(exp){const n=parseInt((exp.date||"").split("-")[2],10);return isNaN(n)?0:n;}
function totalDia(d){return exps.filter(e=>diaDe(e)===d).reduce((a,e)=>a+e.amount,0);}
function totalRango(a,b){return exps.filter(e=>{const d=diaDe(e);return d>=a&&d<=b;}).reduce((s,e)=>s+e.amount,0);}
const fmtK=n=>n>=1000?`$${Math.round(n/1000)}k`:`$${n}`;
const DIA_LETRA=["D","L","M","M","J","V","S"];

function pickBloque(i){haptic("light");selBloque=i;selDia=null;renderExps();}
function pickDia(d){haptic("light");selDia=(selDia===d?null:d);renderExps();}
function onBuscar(v){busq=v;renderExps();}
function limpiarBusq(){haptic("light");busq="";renderExps();}

function renderExps(){
  const q=busq.toLowerCase().trim(), buscando=q.length>0;
  const bloques=bloquesDelMes();
  if(selBloque>=bloques.length)selBloque=0;

  // buscador
  let h=`<div class="srch">
    <span class="mag">🔍</span>
    <input id="q-gastos" placeholder="Buscar gasto…" value="${busq.replace(/"/g,"&quot;")}"
      oninput="onBuscar(this.value)" autocomplete="off"/>
    ${busq?`<button class="clr" onclick="limpiarBusq()">✕</button>`:""}
  </div>`;

  // bloques
  const totMes=exps.reduce((a,e)=>a+e.amount,0);
  h+=`<div class="wkrow">`;
  bloques.forEach((b,i)=>{
    const t=totalRango(b[0],b[1]);
    h+=`<button class="${!buscando&&i===selBloque?"on":""}" onclick="pickBloque(${i})">
      <div class="wl">S${i+1}</div><div class="wv">${t?fmtK(t):"—"}</div></button>`;
  });
  h+=`<button class="${!buscando&&selBloque===-1?"on":""}" onclick="pickBloque(-1)">
    <div class="wl">Mes</div><div class="wv">${totMes?fmtK(totMes):"—"}</div></button></div>`;

  // tira de días
  if(!buscando&&selBloque>=0){
    const [a,b]=bloques[selBloque];
    const maxD=Math.max(...exps.map(e=>totalDia(diaDe(e))),1);
    const pDia=new Date(curYear,curMonth,1).getDay();
    h+=`<div class="calrow">`;
    for(let d=a;d<=b;d++){
      const t=totalDia(d), alto=t?Math.max(3,(t/maxD)*13):3;
      const col=!t?"rgba(255,255,255,.07)":t>maxD*.5?"var(--red)":t>maxD*.15?"var(--amber)":"var(--green)";
      h+=`<div class="dcell ${selDia===d?"on":""} ${t?"":"void"}" onclick="pickDia(${d})">
        <div class="dwd">${DIA_LETRA[(pDia+d-1)%7]}</div>
        <div class="dnum">${d}</div>
        <div class="dbar" style="height:${alto}px;background:${col}"></div></div>`;
    }
    h+=`</div>`;
  }

  // selección
  let lista,titulo,sub="";
  if(buscando){
    lista=exps.filter(e=>(e.description||"").toLowerCase().includes(q)||getC(e.category).label.toLowerCase().includes(q));
    titulo="Resultados";sub=`“${busq}”`;
  }else if(selBloque===-1){
    lista=[...exps];titulo=MONTHS[curMonth];
  }else if(selDia){
    lista=exps.filter(e=>diaDe(e)===selDia);titulo=`${selDia} de ${MONTHS[curMonth].toLowerCase()}`;
  }else{
    const [a,b]=bloques[selBloque];
    lista=exps.filter(e=>{const d=diaDe(e);return d>=a&&d<=b;});
    titulo=`Semana ${selBloque+1}`;sub=`${a}–${b}`;
  }
  lista=[...lista].sort((x,y)=>diaDe(y)-diaDe(x));
  const tot=lista.reduce((a,e)=>a+e.amount,0);
  h+=`<div class="selrow">
    <span class="l">${titulo}<span class="s">${sub?sub+" · ":""}${lista.length} gasto${lista.length===1?"":"s"}</span></span>
    <span class="r">${fmt(tot)}</span></div>`;

  // lista
  if(!lista.length){
    h+=`<div class="card" style="padding:44px 22px;text-align:center;color:var(--text3)">
      <div style="font-size:44px;margin-bottom:12px">${buscando?"🔍":"💸"}</div>
      <div style="font-size:15px;font-weight:600;color:var(--text2);margin-bottom:6px">
        ${buscando?"Sin resultados":"Sin gastos en este período"}</div>
      <div style="font-size:13px">${buscando?"Prueba con otra palabra":'Toca el <strong style="color:var(--blue)">+</strong> para agregar'}</div>
    </div>`;
  }else{
    const agrupar=!selDia;
    let last=null;
    lista.forEach(exp=>{
      const d=diaDe(exp);
      if(agrupar&&d!==last){
        h+=`<div class="dayhdr"><b>${d} de ${MONTHS[curMonth].toLowerCase()}</b><span>${fmt(totalDia(d))}</span></div>`;
        last=d;
      }
      const cat=getC(exp.category);
      h+=`<div class="sw-row" data-id="${exp.id}">
        <div class="sw-bg" onclick="delExpM('${exp.id}')">Eliminar</div>
        <div class="sw-fg" style="padding:13px 15px;display:flex;align-items:center;gap:13px" onclick="tapExp(event,'${exp.id}')">
          <div style="width:42px;height:42px;border-radius:13px;background:${cat.color}18;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;border:1px solid ${cat.color}30">${cat.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${exp.description||cat.label}</div>
            <div style="font-size:12px;color:var(--text2);margin-top:2px">${cat.label}</div>
          </div>
          <div style="font-family:'DM Mono',monospace;font-weight:700;font-size:15px;color:${cat.color};white-space:nowrap;flex-shrink:0">${fmt(exp.amount)}</div>
        </div></div>`;
    });
  }

  const el=document.getElementById("tab-expenses");
  el.innerHTML=h;el.className="fade-in";
  activarSwipe();
  const inp=document.getElementById("q-gastos");
  if(inp&&busq){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
}

// ── SWIPE PARA ELIMINAR ───────────────────────────────────────────────────────
let filaAbierta=null;
function tapExp(e,id){
  if(filaAbierta){cerrarSwipe();return;}
  openEditExp(id);
}
function cerrarSwipe(){
  if(!filaAbierta)return;
  filaAbierta.style.transition="transform .28s cubic-bezier(.32,1,.5,1)";
  filaAbierta.style.transform="translateX(0)";
  filaAbierta=null;
}
function activarSwipe(){
  filaAbierta=null;
  document.querySelectorAll("#tab-expenses .sw-row").forEach(row=>{
    const fg=row.querySelector(".sw-fg");
    let x0=0,dx=0,abierta=false,arrastrando=false,vibrado=false;
    const LIM=-96;
    fg.addEventListener("touchstart",ev=>{
      if(filaAbierta&&filaAbierta!==fg)cerrarSwipe();
      x0=ev.touches[0].clientX;arrastrando=true;vibrado=false;
      fg.style.transition="none";
    },{passive:true});
    fg.addEventListener("touchmove",ev=>{
      if(!arrastrando)return;
      dx=ev.touches[0].clientX-x0+(abierta?LIM:0);
      if(dx>0)dx*=.25;
      if(dx<LIM-40)dx=LIM-40+(dx-(LIM-40))*.25;
      if(dx<LIM*.7&&!vibrado){haptic("light");vibrado=true;}
      fg.style.transform=`translateX(${dx}px)`;
    },{passive:true});
    fg.addEventListener("touchend",()=>{
      if(!arrastrando)return;
      arrastrando=false;
      fg.style.transition="transform .28s cubic-bezier(.32,1,.5,1)";
      abierta=dx<LIM/2;
      fg.style.transform=`translateX(${abierta?LIM:0}px)`;
      filaAbierta=abierta?fg:null;
      dx=abierta?LIM:0;
    });
  });
}

  const s={};exps.forEach(e=>{s[e.category]=(s[e.category]||0)+Number(e.amount);});
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <div style="font-size:14px;color:var(--text2);font-weight:500">${cats.length} categorías</div>
    <button class="bp" style="padding:10px 16px;font-size:13px" onclick="openNewCat()">+ Nueva</button>
  </div><div class="cat-list" id="cat-list">`;
  cats.forEach(cat=>{
    const isDef=DEF_CATS.some(d=>d.id===cat.id),sp=s[cat.id]||0,bud=Number(buds[cat.id]||0);
    h+=`<div class="card cat-row" data-id="${cat.id}">
      <div class="grip">⠿</div>
      <div style="width:42px;height:42px;border-radius:13px;background:${cat.color}18;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;border:1px solid ${cat.color}30">${cat.icon}</div>

          <span style="font-weight:600;font-size:15px">${cat.label}</span>
          ${isDef?`<span style="font-size:10px;color:var(--text3);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:6px;font-weight:600">BASE</span>`:""}
        </div>
        <div style="font-size:12px;color:var(--text2)">${bud>0?`${fmt(bud)} presupuesto · ${fmt(sp)} gastado`:"Sin presupuesto asignado"}</div>
      </div>
      <button class="bg" style="padding:8px 12px;font-size:13px;flex-shrink:0" onclick="openEditCat('${cat.id}')">✏️</button>
    </div>`;
  });
  h+=`</div><div class="reorder-hint">Mantén presionado ⠿ y arrastra para reordenar</div>`;
  const el=document.getElementById("tab-categories");
  el.innerHTML=h;el.className="fade-in";
  activarReorden();
}

// ── ARRASTRAR PARA REORDENAR ──────────────────────────────────────────────────
function activarReorden(){
  const cont=document.getElementById("cat-list");
  if(!cont)return;
  const filas=[...cont.querySelectorAll(".cat-row")];
  if(filas.length<2)return;

  filas.forEach(fila=>{
    const grip=fila.querySelector(".grip");
    if(!grip)return;

    let p0=0, lastY=0, dy=0, alturas=[], desde=0, hacia=0;
    let activo=false, raf=null, vel=0;
    const BORDE=110, VMAX=16;

    const aplicar=()=>{
      // coordenada de documento: inmune a la deriva del scroll
      dy=(lastY+window.scrollY)-p0;
      fila.style.transform=`translateY(${dy}px) scale(1.02)`;
      let nuevo=desde;
      if(dy>0){
        let acc=0;
        for(let i=desde+1;i<filas.length;i++){acc+=alturas[i];if(dy>acc-alturas[i]/2)nuevo=i;else break;}
      }else if(dy<0){
        let acc=0;
        for(let i=desde-1;i>=0;i--){acc+=alturas[i];if(-dy>acc-alturas[i]/2)nuevo=i;else break;}
      }
      if(nuevo!==hacia){haptic("light");hacia=nuevo;}
      filas.forEach((f,i)=>{
        if(f===fila)return;
        let t=0;
        if(hacia>desde&&i>desde&&i<=hacia)t=-alturas[desde];
        if(hacia<desde&&i<desde&&i>=hacia)t=alturas[desde];
        f.style.transform=`translateY(${t}px)`;
      });
    };

    const loop=()=>{
      if(!activo){raf=null;return;}
      if(vel!==0){
        const antes=window.scrollY;
        window.scrollBy(0,vel);
        if(window.scrollY!==antes)aplicar();
      }
      raf=requestAnimationFrame(loop);
    };

    const calcVel=cy=>{
      const alto=window.innerHeight;
      if(cy<BORDE){
        const f=(BORDE-cy)/BORDE;
        vel=-Math.ceil(f*f*VMAX);
      }else if(cy>alto-BORDE){
        const f=(cy-(alto-BORDE))/BORDE;
        vel=Math.ceil(f*f*VMAX);
      }else vel=0;
    };

    const empezar=ev=>{
      ev.preventDefault();
      activo=true;desde=filas.indexOf(fila);hacia=desde;
      lastY=(ev.touches?ev.touches[0]:ev).clientY;
      p0=lastY+window.scrollY;
      alturas=filas.map(f=>f.getBoundingClientRect().height+10);
      filas.forEach(f=>{f.style.transition="transform .22s cubic-bezier(.32,1,.5,1)";f.style.transform="translateY(0)";});
      fila.classList.add("dragging");
      fila.style.transition="box-shadow .2s";
      document.body.style.overflowAnchor="none";
      haptic("medium");
      if(!raf)raf=requestAnimationFrame(loop);
    };

    const mover=ev=>{
      if(!activo)return;
      ev.preventDefault();
      lastY=(ev.touches?ev.touches[0]:ev).clientY;
      calcVel(lastY);
      aplicar();
    };

    const soltar=async()=>{
      if(!activo)return;
      activo=false;vel=0;
      if(raf){cancelAnimationFrame(raf);raf=null;}
      document.body.style.overflowAnchor="";
      fila.classList.remove("dragging");
      filas.forEach(f=>{f.style.transition="";f.style.transform="";});
      if(hacia===desde)return;
      haptic("medium");
      const arr=[...cats];
      const [m]=arr.splice(desde,1);
      arr.splice(hacia,0,m);
      cats=arr.map((c,i)=>({...c,orden:i}));
      renderCats();
      showSt("saving");
      try{
        await sbUpsert("categorias",cats.map((c,i)=>({id:c.id,label:c.label,icon:c.icon,color:c.color,orden:i})));
        showSt("saved");
      }catch(e){showSt("error");}
    };

    grip.addEventListener("touchstart",empezar,{passive:false});
    grip.addEventListener("touchmove",mover,{passive:false});
    grip.addEventListener("touchend",soltar);
    grip.addEventListener("touchcancel",soltar);
    grip.addEventListener("mousedown",e=>{
      empezar(e);
      const mm=ev=>mover(ev);
      const mu=()=>{soltar();document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);};
      document.addEventListener("mousemove",mm);
      document.addEventListener("mouseup",mu);
    });
  });
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function setTab(tab,btn){
  haptic("light");
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  ["dashboard","expenses","categories"].forEach(t=>{
    const el=document.getElementById(`tab-${t}`);
    el.style.display=t===tab?"block":"none";
    if(t===tab){el.className="fade-in";}
  });
  renderAll();
}
async function prevMonth(){haptic("light");resetFiltros();curMonth===0?(curMonth=11,curYear--):curMonth--;await loadAndRender();}
async function nextMonth(){haptic("light");resetFiltros();curMonth===11?(curMonth=0,curYear++):curMonth++;await loadAndRender();}
function bloqueDeHoy(){
  const hoy=new Date();
  if(hoy.getFullYear()!==curYear||hoy.getMonth()!==curMonth)return 0;
  const bl=bloquesDelMes(),d=hoy.getDate();
  const i=bl.findIndex(b=>d>=b[0]&&d<=b[1]);
  return i<0?0:i;
}
async function loadAndRender(){
  show("s-loading");
  try{await loadAll();selBloque=bloqueDeHoy();show("app");renderAll();}catch(e){showErr(e.message);}
}

// ── EXPENSE ───────────────────────────────────────────────────────────────────
function expFrm(exp){
  const today=new Date().toISOString().split("T")[0];
  let quick="";
  if(!exp&&frecuentes.length){
    quick=`<div style="margin-bottom:18px">
      <div class="qa-title">⚡ Frecuentes · toca para autocompletar</div>
      <div class="qa">${frecuentes.map((f,i)=>{
        const c=getC(f.cat);
        return `<div class="qa-item" onclick="usarFrecuente(${i})">
          <div class="qa-top"><span style="font-size:16px">${c.icon}</span><span class="qa-nm">${f.desc}</span></div>
          <div class="qa-am" style="color:${c.color}">${fmt(f.monto)}</div></div>`;
      }).join("")}</div></div>`;
  }
  return quick+`<div style="display:grid;gap:16px">
    <div><label class="fl">Categoría</label>
      <select class="fi fit" id="e-cat">${cats.map(c=>`<option value="${c.id}"${exp&&c.id===exp.category?" selected":""}>${c.icon} ${c.label}</option>`).join("")}</select>
    </div>
    <div><label class="fl">Monto ($CLP)</label>
      <input class="fi" id="e-amt" type="text" inputmode="numeric" placeholder="Ej: 15.000"
        value="${exp?fmtI(String(exp.amount)):""}" oninput="this.value=fmtI(parseI(this.value))">
    </div>
    <div><label class="fl">Descripción</label>
      <input class="fi fit" id="e-desc" placeholder="Ej: Supermercado Líder" value="${exp?exp.description||"":""}">
    </div>
    <div><label class="fl">Fecha</label>
      <input class="fi fit" id="e-date" type="date" value="${exp?exp.date||today:today}">
    </div>
  </div>`;
}
function usarFrecuente(i){
  const f=frecuentes[i];if(!f)return;
  haptic("medium");
  const amt=document.getElementById("e-amt");
  const desc=document.getElementById("e-desc");
  const cat=document.getElementById("e-cat");
  if(amt)amt.value=fmtI(String(f.monto));
  if(desc)desc.value=f.desc;
  if(cat&&cats.some(c=>c.id===f.cat))cat.value=f.cat;
}

function openExpModal(){
  editExpId=null;
  openMod(`<div style="font-weight:700;font-size:20px;margin-bottom:22px">Nuevo gasto</div>${expFrm(null)}
  <div style="display:flex;gap:10px;margin-top:22px">
    <button class="bg" style="flex:1" onclick="closeModForce()">Cancelar</button>
    <button class="bp" style="flex:1" onclick="saveExpM()">Agregar</button>
  </div>`);
}
function openEditExp(id){
  editExpId=id;const exp=exps.find(e=>e.id==id);if(!exp)return;
  openMod(`<div style="font-weight:700;font-size:20px;margin-bottom:22px">Editar gasto</div>${expFrm(exp)}
  <div style="display:flex;gap:10px;margin-top:22px">
    <button class="bg" style="flex:1" onclick="closeModForce()">Cancelar</button>
    <button class="bg bg-danger" onclick="delExpM('${id}')">Eliminar</button>
    <button class="bp" style="flex:1" onclick="saveExpM()">Actualizar</button>
  </div>`);
}
async function saveExpM(){
  const n=Number(parseI(document.getElementById("e-amt").value));if(!n)return;
  const exp={id:editExpId||Date.now(),category:document.getElementById("e-cat").value,amount:n,
    description:document.getElementById("e-desc").value,date:document.getElementById("e-date").value};
  haptic("medium");
  if(editExpId)exps=exps.map(e=>e.id==editExpId?exp:e);else exps=[exp,...exps];
  closeModForce();renderAll();showSt("saving");
  try{
    await saveExp(exp);
    const aviso=avisoCategoria(exp.category);
    if(aviso)haptic("double");
    showSt("saved",aviso);
  }catch(e){showSt("error");}
}
async function delExpM(id){
  haptic("double");exps=exps.filter(e=>e.id!=id);closeModForce();renderAll();showSt("saving");
  try{await delExp(id);showSt("saved");}catch{showSt("error");}
}

  openMod(`
    <div style="font-weight:700;font-size:20px;margin-bottom:22px">${editCatId?"Editar":"Nueva"} categoría</div>
    <div style="margin-bottom:18px"><label class="fl">Nombre</label>
      <input class="fi fit" id="c-name" value="${label}" placeholder="Ej: Mascotas, Streaming…" autofocus
        oninput="document.getElementById('c-prev-lbl').textContent=this.value||'Vista previa'">
    </div>
    <div style="margin-bottom:18px">
      <label class="fl" style="margin-bottom:10px">Ícono — <span id="c-prev-ico">${icon}</span></label>
      <div style="max-height:130px;overflow-y:auto;padding:4px">${EMOJIS.map(em=>`<button class="ej ${em===icon?"on":""}" onclick="selIco('${em}',this)">${em}</button>`).join("")}</div>
    </div>
    <div style="margin-bottom:22px">
      <label class="fl" style="margin-bottom:10px">Color</label>
      <div style="padding:4px">${COLORS.map(c=>`<div class="cd ${c===color?"on":""}" style="background:${c}" onclick="selCol('${c}',this)"></div>`).join("")}</div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-radius:14px;padding:12px 14px;border:1px solid var(--border)">
        <div id="c-prev-icon" style="width:40px;height:40px;border-radius:12px;background:${color}20;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid ${color}35">${icon}</div>
        <span id="c-prev-lbl" style="font-weight:600;font-size:16px;color:${color}">${label||"Vista previa"}</span>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="bg" style="flex:1" onclick="closeModForce()">Cancelar</button>
      ${editCatId&&!isDef?`<button class="bg bg-danger" onclick="delCatM()">Eliminar</button>`:""}
      <button class="bp" style="flex:1" onclick="saveCatM()">${editCatId?"Guardar":"Crear"}</button>
    </div>`);
}
function selIco(em,btn){haptic("light");window._ci=em;document.getElementById("c-prev-ico").textContent=em;document.getElementById("c-prev-icon").textContent=em;document.querySelectorAll(".ej").forEach(b=>b.classList.remove("on"));btn.classList.add("on");}
function selCol(c,el){haptic("light");window._cc=c;const pi=document.getElementById("c-prev-icon");pi.style.background=c+"20";pi.style.border=`1px solid ${c}35`;document.getElementById("c-prev-lbl").style.color=c;document.querySelectorAll(".cd").forEach(d=>d.classList.remove("on"));el.classList.add("on");}
async function saveCatM(){
  const label=document.getElementById("c-name").value.trim();if(!label)return;
  const id=editCatId||`c${Date.now()}`;
  const prev=cats.find(c=>c.id===editCatId);
  const cat={id,label,icon:window._ci,color:window._cc,orden:prev?prev.orden:(cats.length?Math.max(...cats.map(c=>c.orden??0))+1:0)};
  haptic("medium");
  if(editCatId)cats=cats.map(c=>c.id===editCatId?cat:c);else cats=[...cats,cat];
  closeModForce();renderAll();showSt("saving");
  try{await saveCat(cat);showSt("saved");}catch(e){showSt("error");}
}
async function delCatM(){
  haptic("double");cats=cats.filter(c=>c.id!==editCatId);closeModForce();renderAll();showSt("saving");
  try{await delCat(editCatId);showSt("saved");}catch{showSt("error");}
}

window.fmtI=fmtI;window.parseI=parseI;

function hideSplash(){
  const sp=document.getElementById("splash");
  if(!sp||sp.classList.contains("hide"))return;
  sp.classList.add("hide");
  setTimeout(()=>sp.remove(),500);
}

async function init(){
  show("s-loading");
  const t0=Date.now();
  try{
    await loadAll();
    show("app");
    document.querySelector(".nav-item.on").dataset.tab="dashboard";
    renderAll();
  }catch(e){
    showErr(e.message);
  }
  // el splash se ve al menos 1.1s para que la animación se aprecie
  const espera=Math.max(0,1100-(Date.now()-t0));
  setTimeout(hideSplash,espera);
}
// red de seguridad: nunca dejar el splash pegado
setTimeout(hideSplash,6000);
init();
</script>
</body>
</html>
