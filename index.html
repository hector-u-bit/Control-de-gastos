<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Mis Gastos"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Control de Gastos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0a0f;
  --bg2:#12121a;
  --bg3:#1a1a26;
  --border:#ffffff0f;
  --text:#f0f0f8;
  --text2:#8888aa;
  --text3:#44445a;
  --blue:#4f8ef7;
  --blue2:#3a7ee8;
  --green:#34d17a;
  --red:#ff5f57;
  --amber:#ffb340;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 8px 32px rgba(0,0,0,0.4);
}
html{height:100%;background:var(--bg);}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:0;}

/* ── TRANSITIONS ── */
.fade-in{animation:fadeIn .25s ease both;}
.slide-up{animation:slideUp .3s cubic-bezier(.32,1.2,.6,1) both;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}

/* ── GLASS CARDS ── */
.card{
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.02) 100%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.card-press{transition:transform .12s ease,opacity .12s ease;}
.card-press:active{transform:scale(.97);opacity:.85;}

/* ── BUTTONS ── */
.bp{
  background:var(--blue);
  color:#fff;border:none;
  border-radius:14px;
  padding:14px 22px;
  font-family:inherit;font-weight:600;cursor:pointer;font-size:15px;
  transition:transform .1s,opacity .1s;
  box-shadow:0 4px 16px rgba(79,142,247,.35);
}
.bp:active{transform:scale(.96);opacity:.9;}
.bg{
  background:rgba(255,255,255,.07);
  color:var(--text2);
  border:1px solid var(--border);
  border-radius:14px;padding:14px 18px;
  font-family:inherit;font-weight:500;cursor:pointer;font-size:15px;
  transition:transform .1s,opacity .1s;
}
.bg:active{transform:scale(.96);}
.bg-danger{color:var(--red);border-color:rgba(255,95,87,.3);background:rgba(255,95,87,.08);}

/* ── INPUTS ── */
.fl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;display:block;}
.fi{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:16px;outline:none;
  transition:border-color .2s,background .2s;
  -webkit-appearance:none;
}
.fi:focus{border-color:var(--blue);background:rgba(79,142,247,.08);}
.fit{font-family:'DM Sans',sans-serif!important;}
select.fi option{background:#1a1a26;}

/* ── PROGRESS ── */
.pb{height:6px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;}
.pf{height:100%;border-radius:6px;transition:width .7s cubic-bezier(.4,0,.2,1);}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:100;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  animation:fadeIn .2s ease both;
}
.modal{
  background:linear-gradient(180deg,#1c1c2e 0%,#16162a 100%);
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px 28px 0 0;
  padding:8px 24px 40px;
  width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.32,1.2,.6,1) both;
}
.modal-handle{width:40px;height:5px;background:rgba(255,255,255,.15);border-radius:3px;margin:12px auto 20px;}

/* ── TABS (bottom nav style) ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,10,15,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:center;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  z-index:50;gap:4px;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border:none;background:none;cursor:pointer;
  font-family:inherit;color:var(--text3);font-size:10px;font-weight:500;
  transition:color .2s;border-radius:12px;
}
.nav-item.on{color:var(--blue);}
.nav-item .nav-icon{font-size:22px;line-height:1;transition:transform .2s;}
.nav-item.on .nav-icon{transform:scale(1.1);}
.nav-item span{letter-spacing:.01em;}

/* ── CHIP ── */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;
  cursor:pointer;border:1px solid transparent;
  background:rgba(255,255,255,.06);margin:3px;
  transition:all .15s;color:var(--text2);
}
.chip.on{border-color:var(--blue);background:rgba(79,142,247,.15);color:var(--blue);}

/* ── EMOJI BTN ── */
.ej{
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;width:40px;height:40px;font-size:19px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;margin:2px;
  transition:all .15s;
}
.ej.on{border-color:var(--blue);background:rgba(79,142,247,.15);}
.cd{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-block;margin:3px;transition:all .15s;}
.cd.on{border-color:#fff;transform:scale(1.25);box-shadow:0 0 0 3px rgba(255,255,255,.2);}

/* ── SCREEN ── */
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:32px;text-align:center;}

/* ── FAB ── */
.fab{
  position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:20px;
  width:56px;height:56px;border-radius:28px;
  background:var(--blue);color:#fff;border:none;
  font-size:26px;line-height:1;cursor:pointer;
  box-shadow:0 6px 24px rgba(79,142,247,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:49;
  transition:transform .15s,box-shadow .15s;
}
.fab:active{transform:scale(.9);box-shadow:0 3px 12px rgba(79,142,247,.4);}

/* ── HEADER ── */
.header{
  background:rgba(10,10,15,.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:calc(16px + env(safe-area-inset-top)) 20px 16px;
  position:sticky;top:0;z-index:40;
}

/* ── SUMMARY CARDS ── */
.sum-card{
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;min-width:0;overflow:hidden;
}

/* ── SPINNER ── */
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto;}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── DONA ── */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-svg{transform-origin:center;flex-shrink:0}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.lrow{display:flex;align-items:center;gap:8px;font-size:12px;opacity:0;transform:translateX(-6px)}
.lrow.in{animation:lrowIn .45s cubic-bezier(.3,1,.5,1) both}
@keyframes lrowIn{to{opacity:1;transform:translateX(0)}}
.ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lname{flex:1;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lval{font-family:'DM Mono',monospace;font-weight:600;font-size:11px;flex-shrink:0}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .45s ease, visibility .45s ease;
}
#splash.hide{opacity:0;visibility:hidden;}
#splash img{
  width:104px;height:104px;border-radius:24px;
  animation:splashPop .7s cubic-bezier(.34,1.4,.5,1) both;
  box-shadow:0 12px 48px rgba(79,142,247,.28);
}
#splash .splash-name{
  font-size:26px;font-weight:700;letter-spacing:2px;color:#fff;
  animation:splashFade .6s ease .25s both;
}
#splash .splash-sub{
  font-size:12px;color:#5a5a75;letter-spacing:3px;text-transform:uppercase;font-weight:600;
  animation:splashFade .6s ease .4s both;
}
#splash .splash-dots{
  display:flex;gap:6px;margin-top:6px;
  animation:splashFade .6s ease .55s both;
}
#splash .splash-dots i{
  width:6px;height:6px;border-radius:50%;background:#4f8ef7;display:block;
  animation:dotPulse 1.2s ease-in-out infinite;
}
#splash .splash-dots i:nth-child(2){animation-delay:.15s}
#splash .splash-dots i:nth-child(3){animation-delay:.3s}
@keyframes splashPop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes splashFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotPulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* ── SAVE STATUS ── */
.save-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:600;font-family:'DM Mono',monospace;
  transition:all .3s;
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">

<div id="app" style="display:none;padding-bottom:90px">

        <div id="s-bud" style="font-size:15px;font-weight:700;font-family:'DM Mono',monospace;color:var(--blue);word-break:break-all;line-height:1.15">$0</div>

  <!-- CONTENT -->

</div>

<!-- FAB -->

<!-- BOTTOM NAV -->

  </button>
  <button class="nav-item" data-tab="expenses" onclick="setTab('expenses',this)">
    <span class="nav-icon">💸</span><span>Gastos</span>
  </button>

    <span class="nav-icon">🏷</span><span>Categorías</span>
  </button>

<!-- MODAL -->
<div class="overlay" id="modal" style="display:none" onclick="closeMod(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div id="modal-body"></div>
  </div>

<script>
const SB_URL = "https://xxmxsiiroawcqxwgybmj.supabase.co";
const SB_KEY = "sb_publishable_U98gIUNYq9Ro-fzcjUOjqQ_r2Bc4kPV";
const H = {"Content-Type":"application/json","apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`};

const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DEF_CATS=[
  {id:"vivienda",label:"Vivienda",icon:"🏠",color:"#4f8ef7"},
  {id:"alimentacion",label:"Alimentación",icon:"🛒",color:"#ffb340"},
  {id:"transporte",label:"Transporte",icon:"🚗",color:"#34d17a"},
  {id:"salud",label:"Salud",icon:"💊",color:"#ff5f57"},
  {id:"entretenimiento",label:"Entretenimiento",icon:"🎬",color:"#bf5af2"},
  {id:"educacion",label:"Educación",icon:"📚",color:"#32d2d2"},
  {id:"ropa",label:"Ropa",icon:"👔",color:"#ff9f0a"},
  {id:"ahorro",label:"Ahorro",icon:"💰",color:"#30d158"},
  {id:"otros",label:"Otros",icon:"📦",color:"#636379"},
];
const EMOJIS=["🏠","🛒","🚗","💊","🎬","📚","👔","💰","📦","✈️","🍔","☕","🎮","🐾","💇","🏋️","🎵","🎁","🔧","💡","📱","🖥️","🎓","🏦","🏥","🍷","🛍️","🧴","⚡","🌐","🎯","🚀","🏖️","🎪","🎨","📷","🚴","🧘","🏡","🌿","💼","🤝","🎤","🧩","🛠️","🔑","🧾","🌙"];
const COLORS=["#4f8ef7","#ffb340","#34d17a","#ff5f57","#bf5af2","#32d2d2","#ff9f0a","#30d158","#636379","#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff6b9d","#c77dff","#48cae4","#f4a261","#2ec4b6","#e76f51","#a8dadc"];

let curMonth=new Date().getMonth(), curYear=new Date().getFullYear();
let cats=[...DEF_CATS], buds={}, exps=[], filtCat="all";
let editExpId=null, editCatId=null, editBudId=null;

const fmt=n=>`$${Number(n).toLocaleString("es-CL")}`;
const fmtI=r=>{const d=String(r).replace(/\D/g,"");return d?Number(d).toLocaleString("es-CL"):"";};
const parseI=v=>String(v).replace(/\./g,"");
const mk=()=>`${curYear}-${String(curMonth+1).padStart(2,"0")}`;
const getC=id=>cats.find(c=>c.id===id)||{label:id,icon:"📦",color:"#636379"};

// ── HÁPTICA ───────────────────────────────────────────────────────────────────
function haptic(tipo){
  if(!navigator.vibrate)return;
  const p={light:8,medium:18,heavy:30,double:[12,50,12]}[tipo]||8;
  try{navigator.vibrate(p);}catch{}
}

// ── CONTADOR ANIMADO ──────────────────────────────────────────────────────────
const easeOutC=p=>1-Math.pow(1-p,3);
function countTo(el,to,dur=750){
  if(!el)return;
  const from=0,t0=performance.now();
  el.__anim=(el.__anim||0)+1;
  const mine=el.__anim;
  (function step(t){
    if(el.__anim!==mine)return;
    const p=Math.min((t-t0)/dur,1);
    el.textContent=fmt(Math.round(from+(to-from)*easeOutC(p)));
    if(p<1)requestAnimationFrame(step);
  })(performance.now());
}

// ── DONA (opción B: crecer con rebote) ────────────────────────────────────────
const NS_SVG="http://www.w3.org/2000/svg";
function buildDonut(datos,total){
  const CX=65,CY=65,R=48,SW=18,CIRC=2*Math.PI*R;
  let svg=`<svg width="130" height="130" viewBox="0 0 130 130" class="donut-svg" id="donut-svg">`;
  svg+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="${SW}"/>`;
  let acc=0;
  datos.forEach(d=>{
    const len=CIRC*(d.v/total);
    svg+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${d.c}" stroke-width="${SW}"
      stroke-linecap="round" stroke-dasharray="${Math.max(len-3,2).toFixed(1)} ${CIRC.toFixed(1)}"
      transform="rotate(${(-90+(acc/CIRC)*360).toFixed(2)} ${CX} ${CY})"/>`;
    acc+=len;
  });
  svg+=`</svg>`;
  return svg;
}
function animateDonut(){
  const svg=document.getElementById("donut-svg");
  if(!svg)return;
  svg.style.transformOrigin="65px 65px";
  svg.style.transition="none";
  svg.style.transform="scale(.4) rotate(-45deg)";
  svg.style.opacity="0";
  requestAnimationFrame(()=>{
    svg.style.transition="transform .75s cubic-bezier(.34,1.5,.5,1), opacity .4s ease";
    svg.style.transform="scale(1) rotate(0deg)";
    svg.style.opacity="1";
  });
  const lg=document.getElementById("donut-legend");
  if(lg)requestAnimationFrame(()=>lg.querySelectorAll(".lrow").forEach(r=>r.classList.add("in")));
  const tot=document.getElementById("donut-total");
  if(tot)countTo(tot,Number(tot.dataset.v||0),800);
}

// ── SUPABASE ──────────────────────────────────────────────────────────────────
async function sbGet(t,q=""){const r=await fetch(`${SB_URL}/rest/v1/${t}${q}`,{headers:{...H,"Accept":"application/json"}});if(!r.ok){const e=await r.json();throw new Error(e.message||`Error ${r.status}`);}return r.json();}
async function sbUpsert(t,d){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:"POST",headers:{...H,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(Array.isArray(d)?d:[d])});if(!r.ok){const e=await r.json();throw new Error(e.message||`Error guardando`);}}
async function sbDelete(t,q){const r=await fetch(`${SB_URL}/rest/v1/${t}${q}`,{method:"DELETE",headers:H});if(!r.ok){const e=await r.json();throw new Error(e.message||`Error borrando`);}}

// ── DATA ──────────────────────────────────────────────────────────────────────
async function loadAll(){
  const m=mk();
  let [cr,br,er]=await Promise.all([sbGet("categorias","?order=orden"),sbGet("presupuestos",`?mes=eq.${m}`),sbGet("gastos",`?mes=eq.${m}&order=id.desc`)]);
  // PRIMERA VEZ: sembrar las categorías base en la base de datos
  if(!cr.length){
    await sbUpsert("categorias",DEF_CATS.map((c,i)=>({id:c.id,label:c.label,icon:c.icon,color:c.color,orden:i})));
    cr=await sbGet("categorias","?order=orden");
  }
  cats=cr.map(r=>({id:r.id,label:r.label,icon:r.icon,color:r.color,orden:r.orden??999}));
  buds={};br.forEach(r=>{buds[r.categoria_id]=Number(r.monto);});
  exps=er.map(r=>({id:r.id,category:r.categoria_id,amount:Number(r.monto),description:r.descripcion||"",date:r.fecha||""}));
}
async function saveCat(c){await sbUpsert("categorias",{id:c.id,label:c.label,icon:c.icon,color:c.color,orden:c.orden??cats.length});}
async function delCat(id){await sbDelete("categorias",`?id=eq.${id}`);}
async function saveBud(cid,m){if(m>0)await sbUpsert("presupuestos",{mes:mk(),categoria_id:cid,monto:m});else await sbDelete("presupuestos",`?mes=eq.${mk()}&categoria_id=eq.${cid}`);}
async function saveExp(e){await sbUpsert("gastos",{id:String(e.id),mes:mk(),categoria_id:e.category,monto:e.amount,descripcion:e.description||"",fecha:e.date||""});}
async function delExp(id){await sbDelete("gastos",`?id=eq.${id}`);}

// ── STATUS ────────────────────────────────────────────────────────────────────
let stT;
function showSt(t){
  const el=document.getElementById("save-st");
  el.style.display="inline-flex";
  el.className="save-pill";
  const m={saving:["⏳ guardando","rgba(255,255,255,.1)","#888"],saved:["✓ guardado","rgba(52,209,122,.15)","#34d17a"],error:["⚠ error","rgba(255,95,87,.15)","#ff5f57"]};
  el.textContent=m[t][0];el.style.background=m[t][1];el.style.color=m[t][2];
  clearTimeout(stT);if(t!=="saving")stT=setTimeout(()=>{el.style.display="none";},2500);
}

// ── SCREENS ───────────────────────────────────────────────────────────────────
function show(id){
  ["s-loading","s-error","app"].forEach(s=>{
    const el=document.getElementById(s);
    el.style.display=s===id?(s==="app"?"block":"flex"):"none";
  });
  const fab=document.getElementById("fab-btn");
  if(fab)fab.style.display=id==="app"?"flex":"none";
}
function showErr(m){document.getElementById("error-msg").textContent=m;show("s-error");}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderAll(){
  document.getElementById("month-lbl").textContent=`${MONTHS[curMonth]} ${curYear}`;
  const tb=Object.values(buds).reduce((a,b)=>a+Number(b||0),0);
  const ts=exps.reduce((a,e)=>a+Number(e.amount||0),0);
  const tl=tb-ts,pct=tb>0?(ts/tb)*100:0;
  countTo(document.getElementById("s-bud"),tb);
  countTo(document.getElementById("s-spt"),ts);
  document.getElementById("s-spt").style.color=pct>100?"var(--red)":"var(--amber)";
  document.getElementById("s-pct").textContent=`${Math.round(pct)}%`;
  countTo(document.getElementById("s-lft"),Math.max(tl,0));
  document.getElementById("s-lft").style.color=tl<0?"var(--red)":"var(--green)";
  document.getElementById("s-lft-sub").textContent=tl<0?"⚠ Excedido":"Libre";
  const bar=document.getElementById("g-bar");
  bar.style.width=`${Math.min(pct,100)}%`;
  bar.style.background=pct>90?"var(--red)":pct>70?"var(--amber)":"var(--blue)";
  const tab=document.querySelector(".nav-item.on")?.dataset.tab||"dashboard";
  if(tab==="dashboard")renderDash();
  else if(tab==="expenses")renderExps();
  else renderCats();
}

function renderDash(){
  const s={};exps.forEach(e=>{s[e.category]=(s[e.category]||0)+Number(e.amount);});
  let h="";

  // ── DONA DE DISTRIBUCIÓN ──
  const datos=cats.map(c=>({n:c.label,v:s[c.id]||0,c:c.color})).filter(d=>d.v>0).sort((a,b)=>b.v-a.v);
  const totalGasto=datos.reduce((a,d)=>a+d.v,0);
  if(totalGasto>0){
    const top=datos.slice(0,5);
    const resto=datos.slice(5);
    if(resto.length){top.push({n:`Otros (${resto.length})`,v:resto.reduce((a,d)=>a+d.v,0),c:"#636379"});}
    h+=`<div class="card" style="padding:18px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-weight:700;font-size:15px">Distribución del gasto</div>
        <div style="font-size:11px;color:var(--text3)">${MONTHS[curMonth]}</div>
      </div>
      <div class="donut-wrap">
        <div style="position:relative;flex-shrink:0">
          ${buildDonut(top,totalGasto)}
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
            <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700">Total</div>
            <div id="donut-total" data-v="${totalGasto}" style="font-family:'DM Mono',monospace;font-weight:700;font-size:15px">$0</div>
          </div>
        </div>
        <div class="legend" id="donut-legend">
          ${top.map((d,i)=>`<div class="lrow" style="animation-delay:${350+i*70}ms">
            <span class="ldot" style="background:${d.c}"></span>
            <span class="lname">${d.n}</span>
            <span class="lval" style="color:${d.c}">${Math.round(d.v/totalGasto*100)}%</span>
          </div>`).join("")}
        </div>
      </div>
    </div>`;
  }

  h+='<div style="font-size:13px;color:var(--text2);margin-bottom:16px;font-weight:500">Toca una categoría para editar su presupuesto</div><div style="display:grid;gap:12px">';
  cats.forEach(cat=>{
    const bud=Number(buds[cat.id]||0),sp=s[cat.id]||0,pct=bud>0?(sp/bud)*100:0,left=bud-sp;
    const bc=pct>100?"var(--red)":pct>80?"var(--amber)":cat.color;
    const r=22,circ=2*Math.PI*r,off=circ*(1-Math.min(pct,100)/100);
    const rad=bud>0?`<svg width="52" height="52" viewBox="0 0 52 52" style="flex-shrink:0">
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="4"/>
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="${pct>100?"var(--red)":cat.color}" stroke-width="4"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        stroke-linecap="round" transform="rotate(-90 26 26)" style="transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)"/>
      <text x="26" y="27" text-anchor="middle" dominant-baseline="middle"
        fill="${pct>100?"var(--red)":"#f0f0f8"}" font-size="9" font-family="monospace" font-weight="700">${Math.round(pct)}%</text>
    </svg>`:`<div style="width:52px;height:52px;border:2px dashed rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2);font-size:22px;flex-shrink:0">+</div>`;
    h+=`<div class="card card-press" style="padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer" onclick="openBudMod('${cat.id}')">
      <div style="width:44px;height:44px;border-radius:14px;background:${cat.color}18;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid ${cat.color}30">${cat.icon}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">
          <div style="font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cat.label}</div>
          <div style="font-size:12px;white-space:nowrap;flex-shrink:0">
            <span style="font-family:'DM Mono',monospace;color:${bc};font-weight:700">${fmt(sp)}</span>
            ${bud>0?`<span style="color:var(--text3)"> / ${fmt(bud)}</span>`:""}
          </div>
        </div>
        <div class="pb"><div class="pf" style="width:${Math.min(pct,100)}%;background:${bc}"></div></div>
        <div style="font-size:11px;color:var(--text3);margin-top:5px">${bud>0?(left>=0?`${fmt(left)} disponible`:`${fmt(Math.abs(left))} excedido`):"Sin presupuesto · toca para asignar"}</div>
      </div>${rad}
    </div>`;
  });
  const el=document.getElementById("tab-dashboard");
  el.innerHTML=h+"</div>";
  el.className="fade-in";
  animateDonut();
}

function renderExps(){
  const fil=filtCat==="all"?exps:exps.filter(e=>e.category===filtCat);
  const used=cats.filter(c=>exps.some(e=>e.category===c.id));
  let h=`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px">
    <span class="chip ${filtCat==="all"?"on":""}" onclick="setFilt('all')">Todos · ${exps.length}</span>`;
  used.forEach(c=>{h+=`<span class="chip ${filtCat===c.id?"on":""}" style="${filtCat===c.id?`color:${c.color};border-color:${c.color};background:${c.color}18`:""}" onclick="setFilt('${c.id}')">${c.icon} ${c.label}</span>`;});
  h+="</div>";
  if(!fil.length){
    h+=`<div class="card" style="padding:48px 24px;text-align:center;color:var(--text3)">
      <div style="font-size:48px;margin-bottom:14px">💸</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text2)">Sin gastos</div>
      <div style="font-size:13px">Toca el <strong style="color:var(--blue)">+</strong> para agregar tu primer gasto</div>
    </div>`;
  }else{
    h+='<div style="display:grid;gap:10px">';
    fil.forEach(exp=>{
      const cat=getC(exp.category);
      h+=`<div class="card card-press" style="padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer" onclick="openEditExp('${exp.id}')">
        <div style="width:44px;height:44px;border-radius:14px;background:${cat.color}18;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid ${cat.color}30">${cat.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:15px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${exp.description||cat.label}</div>
          <div style="font-size:12px;color:var(--text2)">${exp.date} · ${cat.label}</div>
        </div>
        <div style="font-family:'DM Mono',monospace;font-weight:700;font-size:16px;color:${cat.color};white-space:nowrap;flex-shrink:0">${fmt(exp.amount)}</div>
      </div>`;
    });
    const total=fil.reduce((a,e)=>a+e.amount,0);
    h+=`<div style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:4px">
      <span style="color:var(--text2);font-weight:600;font-size:14px">Total${filtCat!=="all"?" filtrado":""}</span>
      <span style="font-family:'DM Mono',monospace;font-weight:700;font-size:16px">${fmt(total)}</span>
    </div></div>`;
  }
  const el=document.getElementById("tab-expenses");
  el.innerHTML=h;el.className="fade-in";
}

function renderCats(){
  const s={};exps.forEach(e=>{s[e.category]=(s[e.category]||0)+Number(e.amount);});
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <div style="font-size:14px;color:var(--text2);font-weight:500">${cats.length} categorías</div>
    <button class="bp" style="padding:10px 16px;font-size:13px" onclick="openNewCat()">+ Nueva</button>
  </div><div style="display:grid;gap:10px">`;
  cats.forEach(cat=>{
    const isDef=DEF_CATS.some(d=>d.id===cat.id),sp=s[cat.id]||0,bud=Number(buds[cat.id]||0);
    h+=`<div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:44px;border-radius:14px;background:${cat.color}18;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid ${cat.color}30">${cat.icon}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
          <span style="font-weight:600;font-size:15px">${cat.label}</span>
          ${isDef?`<span style="font-size:10px;color:var(--text3);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:6px;font-weight:600">BASE</span>`:""}
        </div>
        <div style="font-size:12px;color:var(--text2)">${bud>0?`${fmt(bud)} presupuesto · ${fmt(sp)} gastado`:"Sin presupuesto asignado"}</div>
      </div>
      <button class="bg" style="padding:8px 12px;font-size:13px;flex-shrink:0" onclick="openEditCat('${cat.id}')">✏️</button>
    </div>`;
  });
  const el=document.getElementById("tab-categories");
  el.innerHTML=h+"</div>";el.className="fade-in";
}

// ── NAV ───────────────────────────────────────────────────────────────────────
function setTab(tab,btn){
  haptic("light");
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  ["dashboard","expenses","categories"].forEach(t=>{
    const el=document.getElementById(`tab-${t}`);
    el.style.display=t===tab?"block":"none";
    if(t===tab){el.className="fade-in";}
  });
  renderAll();
}
function setFilt(cat){haptic("light");filtCat=cat;renderExps();}
async function prevMonth(){haptic("light");filtCat="all";curMonth===0?(curMonth=11,curYear--):curMonth--;await loadAndRender();}
async function nextMonth(){haptic("light");filtCat="all";curMonth===11?(curMonth=0,curYear++):curMonth++;await loadAndRender();}
async function loadAndRender(){
  show("s-loading");
  try{await loadAll();show("app");renderAll();}catch(e){showErr(e.message);}
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openMod(h){
  haptic("light");
  document.getElementById("modal-body").innerHTML=h;
  const m=document.getElementById("modal");
  m.style.display="flex";
}
function closeMod(e){
  if(e&&e.target!==document.getElementById("modal"))return;
  document.getElementById("modal").style.display="none";
}
function closeModForce(){document.getElementById("modal").style.display="none";}

// ── BUDGET ────────────────────────────────────────────────────────────────────
function openBudMod(id){
  editBudId=id;const cat=getC(id),val=buds[id]||"";
  openMod(`
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px">
      <div style="width:52px;height:52px;border-radius:16px;background:${cat.color}20;display:flex;align-items:center;justify-content:center;font-size:28px;border:1px solid ${cat.color}35">${cat.icon}</div>
      <div>
        <div style="font-weight:700;font-size:19px">${cat.label}</div>
        <div style="color:var(--text2);font-size:13px;margin-top:2px">Presupuesto mensual</div>
      </div>
    </div>
    <div style="margin-bottom:20px">
      <label class="fl">Monto ($CLP)</label>
      <input class="fi" id="b-amt" type="text" inputmode="numeric" placeholder="Ej: 200.000"
        value="${val?fmtI(String(val)):""}" oninput="this.value=fmtI(parseI(this.value))" autofocus>
    </div>
    <div style="display:flex;gap:10px">
      <button class="bg" style="flex:1" onclick="closeModForce()">Cancelar</button>
      ${val?`<button class="bg bg-danger" onclick="removeBud()">Quitar</button>`:""}
      <button class="bp" style="flex:1" onclick="saveBudM()">Guardar</button>
    </div>`);
}
async function saveBudM(){
  const n=Number(parseI(document.getElementById("b-amt").value));if(!n||n<=0)return;
  haptic("medium");buds[editBudId]=n;closeModForce();renderAll();showSt("saving");
  try{await saveBud(editBudId,n);showSt("saved");}catch(e){showSt("error");}
}
async function removeBud(){
  haptic("double");delete buds[editBudId];closeModForce();renderAll();showSt("saving");
  try{await saveBud(editBudId,0);showSt("saved");}catch{showSt("error");}
}

// ── EXPENSE ───────────────────────────────────────────────────────────────────
function expFrm(exp){
  const today=new Date().toISOString().split("T")[0];
  return `<div style="display:grid;gap:16px">
    <div><label class="fl">Categoría</label>
      <select class="fi fit" id="e-cat">${cats.map(c=>`<option value="${c.id}"${exp&&c.id===exp.category?" selected":""}>${c.icon} ${c.label}</option>`).join("")}</select>
    </div>
    <div><label class="fl">Monto ($CLP)</label>
      <input class="fi" id="e-amt" type="text" inputmode="numeric" placeholder="Ej: 15.000"
        value="${exp?fmtI(String(exp.amount)):""}" oninput="this.value=fmtI(parseI(this.value))">
    </div>
    <div><label class="fl">Descripción</label>
      <input class="fi fit" id="e-desc" placeholder="Ej: Supermercado Líder" value="${exp?exp.description||"":""}">
    </div>
    <div><label class="fl">Fecha</label>
      <input class="fi fit" id="e-date" type="date" value="${exp?exp.date||today:today}">
    </div>
  </div>`;
}
function openExpModal(){
  editExpId=null;
  openMod(`<div style="font-weight:700;font-size:20px;margin-bottom:22px">Nuevo gasto</div>${expFrm(null)}
  <div style="display:flex;gap:10px;margin-top:22px">
    <button class="bg" style="flex:1" onclick="closeModForce()">Cancelar</button>
    <button class="bp" style="flex:1" onclick="saveExpM()">Agregar</button>
  </div>`);
}
function openEditExp(id){
  editExpId=id;const exp=exps.find(e=>e.id==id);if(!exp)return;
  openMod(`<div style="font-weight:700;font-size:20px;margin-bottom:22px">Editar gasto</div>${expFrm(exp)}
  <div style="display:flex;gap:10px;margin-top:22px">
    <button class="bg" style="flex:1" onclick="closeModForce()">Cancelar</button>
    <button class="bg bg-danger" onclick="delExpM('${id}')">Eliminar</button>
    <button class="bp" style="flex:1" onclick="saveExpM()">Actualizar</button>
  </div>`);
}
async function saveExpM(){
  const n=Number(parseI(document.getElementById("e-amt").value));if(!n)return;
  const exp={id:editExpId||Date.now(),category:document.getElementById("e-cat").value,amount:n,
    description:document.getElementById("e-desc").value,date:document.getElementById("e-date").value};
  haptic("medium");
  if(editExpId)exps=exps.map(e=>e.id==editExpId?exp:e);else exps=[exp,...exps];
  closeModForce();renderAll();showSt("saving");
  try{await saveExp(exp);showSt("saved");}catch(e){showSt("error");}
}
async function delExpM(id){
  haptic("double");exps=exps.filter(e=>e.id!=id);closeModForce();renderAll();showSt("saving");
  try{await delExp(id);showSt("saved");}catch{showSt("error");}
}

// ── CATEGORY ──────────────────────────────────────────────────────────────────
function openNewCat(){editCatId=null;openCatMod("","⭐",COLORS[Math.floor(Math.random()*COLORS.length)]);}
function openEditCat(id){editCatId=id;const c=cats.find(x=>x.id===id);if(!c)return;openCatMod(c.label,c.icon,c.color);}
function openCatMod(label,icon,color){
  window._ci=icon;window._cc=color;
  const isDef=editCatId&&DEF_CATS.some(d=>d.id===editCatId);
  openMod(`
    <div style="font-weight:700;font-size:20px;margin-bottom:22px">${editCatId?"Editar":"Nueva"} categoría</div>
    <div style="margin-bottom:18px"><label class="fl">Nombre</label>
      <input class="fi fit" id="c-name" value="${label}" placeholder="Ej: Mascotas, Streaming…" autofocus
        oninput="document.getElementById('c-prev-lbl').textContent=this.value||'Vista previa'">
    </div>
    <div style="margin-bottom:18px">
      <label class="fl" style="margin-bottom:10px">Ícono — <span id="c-prev-ico">${icon}</span></label>
      <div style="max-height:130px;overflow-y:auto;padding:4px">${EMOJIS.map(em=>`<button class="ej ${em===icon?"on":""}" onclick="selIco('${em}',this)">${em}</button>`).join("")}</div>
    </div>
    <div style="margin-bottom:22px">
      <label class="fl" style="margin-bottom:10px">Color</label>
      <div style="padding:4px">${COLORS.map(c=>`<div class="cd ${c===color?"on":""}" style="background:${c}" onclick="selCol('${c}',this)"></div>`).join("")}</div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-radius:14px;padding:12px 14px;border:1px solid var(--border)">
        <div id="c-prev-icon" style="width:40px;height:40px;border-radius:12px;background:${color}20;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid ${color}35">${icon}</div>
        <span id="c-prev-lbl" style="font-weight:600;font-size:16px;color:${color}">${label||"Vista previa"}</span>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="bg" style="flex:1" onclick="closeModForce()">Cancelar</button>
      ${editCatId&&!isDef?`<button class="bg bg-danger" onclick="delCatM()">Eliminar</button>`:""}
      <button class="bp" style="flex:1" onclick="saveCatM()">${editCatId?"Guardar":"Crear"}</button>
    </div>`);
}
function selIco(em,btn){haptic("light");window._ci=em;document.getElementById("c-prev-ico").textContent=em;document.getElementById("c-prev-icon").textContent=em;document.querySelectorAll(".ej").forEach(b=>b.classList.remove("on"));btn.classList.add("on");}
function selCol(c,el){haptic("light");window._cc=c;const pi=document.getElementById("c-prev-icon");pi.style.background=c+"20";pi.style.border=`1px solid ${c}35`;document.getElementById("c-prev-lbl").style.color=c;document.querySelectorAll(".cd").forEach(d=>d.classList.remove("on"));el.classList.add("on");}
async function saveCatM(){
  const label=document.getElementById("c-name").value.trim();if(!label)return;
  const id=editCatId||`c${Date.now()}`;
  const prev=cats.find(c=>c.id===editCatId);
  const cat={id,label,icon:window._ci,color:window._cc,orden:prev?prev.orden:cats.length};
  haptic("medium");
  if(editCatId)cats=cats.map(c=>c.id===editCatId?cat:c);else cats=[...cats,cat];
  closeModForce();renderAll();showSt("saving");
  try{await saveCat(cat);showSt("saved");}catch(e){showSt("error");}
}
async function delCatM(){
  haptic("double");cats=cats.filter(c=>c.id!==editCatId);closeModForce();renderAll();showSt("saving");
  try{await delCat(editCatId);showSt("saved");}catch{showSt("error");}
}

window.fmtI=fmtI;window.parseI=parseI;

function hideSplash(){
  const sp=document.getElementById("splash");
  if(!sp||sp.classList.contains("hide"))return;
  sp.classList.add("hide");
  setTimeout(()=>sp.remove(),500);
}

async function init(){
  show("s-loading");
  const t0=Date.now();
  try{
    await loadAll();
    show("app");
    document.querySelector(".nav-item.on").dataset.tab="dashboard";
    renderAll();
  }catch(e){
    showErr(e.message);
  }
  // el splash se ve al menos 1.1s para que la animación se aprecie
  const espera=Math.max(0,1100-(Date.now()-t0));
  setTimeout(hideSplash,espera);
}
// red de seguridad: nunca dejar el splash pegado
setTimeout(hideSplash,6000);
init();
</script>
